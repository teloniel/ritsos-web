<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΡΙΤΣΟΣ — Ημερήσια Κατάσταση</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-top">
    <span class="hull-id">ΤΠΚ ΡΙΤΣΟΣ</span>
    <span class="sync-dot" id="syncDot" title="Κατάσταση ενημέρωσης"></span>
  </div>
  <h1 id="todayDate">—</h1>
  <p class="updated-line" id="updatedLine">Φόρτωση...</p>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="daily">ΗΜΕΡΗΣΙΑ</button>
  <button class="tab-btn" data-tab="pending">ΠΡΟΣ ΥΠΟΓΡΑΦΗ <span class="tab-badge" id="pendingBadge"></span></button>
  <button class="tab-btn" data-tab="log">ΒΙΒΛΙΟ ΑΝΑΦΟΡΩΝ</button>
</nav>

<main id="app">

  <section class="panel active" id="panel-daily">
    <div class="panel-empty" id="dailyEmpty" hidden>Δεν υπάρχουν δεδομένα ημερήσιας αναφοράς.</div>
    <div class="roster" id="dailyRoster"></div>
  </section>

  <section class="panel" id="panel-pending">
    <div class="panel-empty" id="pendingEmpty" hidden>Καμία αναφορά δεν εκκρεμεί προς υπογραφή.</div>
    <div class="stack" id="pendingList"></div>
  </section>

  <section class="panel" id="panel-log">
    <div class="log-controls">
      <input type="search" id="logSearch" placeholder="Αναζήτηση ονόματος ή τύπου...">
    </div>
    <div class="panel-empty" id="logEmpty" hidden>Δεν βρέθηκαν αναφορές.</div>
    <div class="stack" id="logList"></div>
  </section>

</main>

<footer class="foot">
  <span>Μόνο για προβολή — τα δεδομένα ενημερώνονται χειροκίνητα</span>
</footer>

<script src="app.js"></script>
</body>
</html>
